name: High-Performance Chunked ZIP Uploader

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch to create or update"
        required: true
        default: "main"
        type: string
      zip_urls:
        description: "Direct HTTPS URL to the ZIP file, one per line"
        required: true
        type: string
      max_file_size_mb:
        description: "Max size per file before splitting (MB, keep under 100)"
        required: true
        default: "95"
        type: string
      files_per_push:
        description: "Number of files/chunks per commit batch to avoid push limits"
        required: true
        default: "1000"
        type: string

permissions:
  contents: write

concurrency:
  group: zip-upload-${{ github.repository }}-${{ inputs.branch_name }}
  cancel-in-progress: false

jobs:
  upload:
    name: Stream, Split, Index, and Push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BRANCH_NAME: ${{ inputs.branch_name }}
      ZIP_URLS: ${{ inputs.zip_urls }}
      MAX_FILE_SIZE: ${{ inputs.max_file_size_mb }}
      BATCH_SIZE: ${{ inputs.files_per_push }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Set up Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Robust Networking Dependencies
        run: pip install --quiet requests urllib3

      - name: Execute High-Performance Pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import stat
          import shutil
          import zipfile
          import tempfile
          import subprocess
          from pathlib import PurePosixPath
          from urllib.parse import urlparse
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          branch = os.environ["BRANCH_NAME"]
          raw_input = os.environ["ZIP_URLS"].replace("\\n", "\n")
          urls = [u.strip() for u in raw_input.splitlines() if u.strip()]
          max_file_size_bytes = int(os.environ["MAX_FILE_SIZE"]) * 1024 * 1024
          batch_size = int(os.environ["BATCH_SIZE"])

          # Strict Branch Name Sanitization
          if (not re.fullmatch(r"[A-Za-z0-9._/-]+", branch)
              or branch.startswith(("/", "-"))
              or branch.endswith(("/", "."))
              or "//" in branch or ".." in branch
              or any(c in branch for c in " ~^:?*[\\")
              or any(p.startswith(".") or p.endswith(".") or p.endswith(".lock")
                     for p in branch.split("/"))):
              raise SystemExit("Error: Invalid branch name structure.")

          if not urls:
              raise SystemExit("Error: Provide at least one valid ZIP URL.")

          for url in urls:
              p = urlparse(url)
              if p.scheme != "https" or not p.hostname or p.username or p.password:
                  raise SystemExit("Error: All URLs must be secure HTTPS without embedded credentials.")

          # Setup Session with Exponential Backoff Retries against Rate Limiting
          session = requests.Session()
          retries = Retry(total=5, backoff_factor=2, status_forcelist=[500, 502, 503, 504, 429])
          session.mount("https://", HTTPAdapter(max_retries=retries))

          with tempfile.TemporaryDirectory() as work_dir:
              os.chdir(work_dir)
              
              # Initialize Lean Git Repository (Zero workspace files)
              subprocess.run(["git", "init", "--initial-branch=main"], check=True)
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "config", "gc.auto", "0"], check=True)
              
              remote_url = f"https://x-access-token:{token}@github.com/{repo}.git"
              subprocess.run(["git", "remote", "add", "origin", remote_url], check=True)

              parent_sha = None
              try:
                  res = subprocess.run(["git", "ls-remote", "origin", f"refs/heads/{branch}"], 
                                       capture_output=True, text=True, check=True)
                  if res.stdout.strip():
                      parent_sha = res.stdout.strip().split()[0]
                      print(f"-> Found existing branch '{branch}' at commit {parent_sha[:7]}. Merging tree metadata (zero downloads)...")
                      subprocess.run(["git", "fetch", "origin", branch, "--depth=1"], check=True)
                      subprocess.run(["git", "read-tree", parent_sha], check=True)
                  else:
                      print(f"-> Branch '{branch}' does not exist. Initializing fresh root chain.")
              except subprocess.CalledProcessError:
                  print("-> Remote check skipped, building isolated branch chain.")

              staged_files_count = 0

              def flush_batch(force=False):
                  global parent_sha, staged_files_count
                  if staged_files_count == 0 or (not force and staged_files_count < batch_size):
                      return
                  
                  print(f"-> Committing batch of {staged_files_count} indexed items...")
                  tree_res = subprocess.run(["git", "write-tree"], capture_output=True, text=True, check=True)
                  tree_sha = tree_res.stdout.strip()

                  commit_msg = f"Data batch update ({staged_files_count} items)"
                  commit_cmd = ["git", "commit-tree", tree_sha, "-m", commit_msg]
                  if parent_sha:
                      commit_cmd.extend(["-p", parent_sha])

                  commit_res = subprocess.run(commit_cmd, capture_output=True, text=True, check=True)
                  parent_sha = commit_res.stdout.strip()
                  
                  print(f"-> Pushing chunk commit {parent_sha[:7]} to origin/{branch}...")
                  subprocess.run(["git", "push", remote_url, f"{parent_sha}:refs/heads/{branch}"], check=True)
                  
                  subprocess.run(["git", "update-ref", f"refs/heads/{branch}", parent_sha], check=True)
                  staged_files_count = 0

              for index, url in enumerate(urls):
                  print(f"\n==========================================")
                  print(f"Processing ZIP {index + 1} of {len(urls)}")
                  print(f"==========================================")
                  zip_filename = f"downloaded-{index}.zip"
                  
                  # Chunked streaming download
                  downloaded_size = 0
                  with session.get(url, stream=True, timeout=(30, 900), headers={"Accept-Encoding": "identity"}) as r:
                      r.raise_for_status()
                      with open(zip_filename, "wb") as f:
                          for chunk in r.iter_content(chunk_size=1024 * 1024 * 10):
                              if chunk:
                                  downloaded_size += len(chunk)
                                  f.write(chunk)
                  print(f"Downloaded {downloaded_size / (1024**2):.1f} MiB successfully.")

                  extract_dir = f"extracted-{index}"
                  os.makedirs(extract_dir, exist_ok=True)

                  with zipfile.ZipFile(zip_filename) as z:
                      entries = z.infolist()
                      for item in entries:
                          name = item.filename.replace("\\", "/")
                          path = PurePosixPath(name)
                          parts = name.rstrip("/").split("/")

                          if item.is_dir() or not name or name.startswith("/") or path.is_absolute() or ".." in parts or "." in parts or stat.S_ISLNK(item.external_attr >> 16):
                              continue
                          if item.flag_bits & 1:
                              raise SystemExit(f"Error: Encrypted archive entries are not supported: {name}")

                          z.extract(item, path=extract_dir)
                          target_path = os.path.join(extract_dir, name)
                          if not os.path.isfile(target_path):
                              continue

                          file_size = os.path.getsize(target_path)

                          if file_size > max_file_size_bytes:
                              print(f"-> Splitting oversized file ({file_size / (1024**2):.1f} MB): {name}")
                              with open(target_path, "rb") as f_big:
                                  part_num = 1
                                  while True:
                                      chunk_data = f_big.read(max_file_size_bytes)
                                      if not chunk_data:
                                          break
                                      part_name = f"{name}.part{part_num}"
                                      
                                      h_proc = subprocess.run(["git", "hash-object", "-w", "--stdin"], input=chunk_data, capture_output=True, text=True, check=True)
                                      blob_sha = h_proc.stdout.strip()
                                      
                                      subprocess.run(["git", "update-index", "--add", "--cacheinfo", f"100644,{blob_sha},{part_name}"], check=True)
                                      staged_files_count += 1
                                      part_num += 1
                                      
                                      if staged_files_count >= batch_size:
                                          flush_batch()
                          else:
                              with open(target_path, "rb") as f_in:
                                  h_proc = subprocess.run(["git", "hash-object", "-w", "--stdin"], stdin=f_in, capture_output=True, text=True, check=True)
                                  blob_sha = h_proc.stdout.strip()

                              subprocess.run(["git", "update-index", "--add", "--cacheinfo", f"100644,{blob_sha},{name}"], check=True)
                              staged_files_count += 1

                          if staged_files_count >= batch_size:
                              flush_batch()

                  # Flush remaining staged files for this ZIP file immediately and push
                  flush_batch(force=True)

                  # Ensure current index state is safely read into the git index for the next zip loop iteration
                  if parent_sha:
                      subprocess.run(["git", "read-tree", parent_sha], check=True)

                  print(f"-> Completed and pushed ZIP {index + 1} of {len(urls)}.")

              # Run garbage collection once safely at the very end
              print("-> Running lightweight final repository optimization...")
              subprocess.run(["git", "gc", "--prune=now"], check=True)

              print(f"\nSuccess! Target branch fully updated: https://github.com/{repo}/tree/{branch}")
          PY
